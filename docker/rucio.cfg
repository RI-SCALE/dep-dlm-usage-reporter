# Minimal Rucio server config for the reporter's local stack: REST API and
# database only. No FTS, daemons or OPA (those live in dep-dlm-testbed).
[common]
logdir = /var/log/rucio
loglevel = INFO

[database]
default = postgresql+psycopg://rucio:rucio@ruciodb/rucio

[bootstrap]
userpass_identity = ddmlab
userpass_pwd = secret

[policy]
permission = generic
schema = generic
lfn2pfn_algorithm_default = hash
support = local
support_rucio = local

[api]
endpoints = accounts, auth, ping, requests, rses

# OIDC tokens from the compose Keycloak (Design-001, step 6), as in
# dep-dlm-testbed's server.client-credentials.cfg. Rucio validates the JWT in
# X-Rucio-Auth-Token: issuer in idpsecrets.json, `rucio` in aud, `pep:rucio`
# in scope, and SUB/ISS mapped to an account (rucio-seed.py).
[oidc]
idpsecrets = /opt/rucio/etc/idpsecrets.json
admin_issuer = keycloak
expected_audience = rucio
expected_scope = pep:rucio
