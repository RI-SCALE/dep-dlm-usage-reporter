# Minimal Rucio server config for the reporter's local stack: REST API and
# database only. No FTS, daemons or OPA (those live in dep-dlm-testbed).
[common]
logdir = /var/log/rucio
loglevel = INFO

[database]
default = postgresql+psycopg://rucio:rucio@ruciodb/rucio

[bootstrap]
userpass_identity = ddmlab
userpass_pwd = secret

[policy]
permission = generic
schema = generic
lfn2pfn_algorithm_default = hash
support = local
support_rucio = local

[api]
endpoints = accounts, auth, ping, requests, rses
