{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "usage-reporter.serviceAccountName" . }}
  labels:
    {{- include "usage-reporter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The job talks to Rucio and ARGO only, never to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
