name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write        # GitHub Release
      packages: write        # GHCR (image and chart)
      id-token: write        # provenance
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Tag matches pyproject and chart versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$v" = "$(uv version --short)"
          grep -qx "version: $v" charts/dep-dlm-usage-reporter/Chart.yaml
          grep -qx "appVersion: \"$v\"" charts/dep-dlm-usage-reporter/Chart.yaml

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: usage-reporter:scan
          cache-from: type=gha
      - name: Scan image (fail on high and critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: usage-reporter:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0   # Helm 4 has failed against GHCR on push
      - name: Package and push chart to GHCR (OCI), with retries
        run: |
          helm package charts/dep-dlm-usage-reporter -d dist-chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for wait in 15 30 0; do
            helm push dist-chart/*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" && exit 0
            [ "$wait" -gt 0 ] && { echo "push failed, retrying in ${wait}s"; sleep "$wait"; }
          done
          exit 1

      - name: GitHub Release with wheel, sdist and chart
        run: |
          uv build
          gh release create "$GITHUB_REF_NAME" dist/* dist-chart/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
